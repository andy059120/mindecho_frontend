name: mindecho_flutter
description: MindEcho 的 Flutter iOS、Android 與 Web 前端。
publish_to: none
# iOS 的顯示版本由 Xcode MARKETING_VERSION 設定；+ 後為 Build number。
version: 1.6.0+11

environment:
  sdk: '>=3.13.7 <4.0.0'
  flutter: '>=3.47.8 <3.48.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  path_provider: ^2.1.6
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
